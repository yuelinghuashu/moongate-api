name: Deploy Go Backend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests
        run: go test ./... -v

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_DOMAIN }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Go image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 显式禁用 provenance 和 SBOM attestations，
          # 解决阿里云 ACR 不支持 OCI attestation manifest 导致的推送失败：
          # denied: unknown manifest class for application/vnd.oci.empty.v1+json
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_DOMAIN }}/${{ secrets.ACR_NAMESPACE }}/moongate-api:latest
            ${{ secrets.ACR_DOMAIN }}/${{ secrets.ACR_NAMESPACE }}/moongate-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACR_DOMAIN: ${{ secrets.ACR_DOMAIN }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OAUTH_GITHUB_KEY: ${{ secrets.OAUTH_GITHUB_KEY }}
          OAUTH_GITHUB_SECRET: ${{ secrets.OAUTH_GITHUB_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: |
            ACR_DOMAIN,
            ACR_NAMESPACE,
            ACR_USERNAME,
            ACR_PASSWORD,
            POSTGRES_DB,
            POSTGRES_USER,
            POSTGRES_PASSWORD,
            JWT_SECRET,
            SESSION_SECRET,
            OAUTH_GITHUB_KEY,
            OAUTH_GITHUB_SECRET
          script: |
            set -e
            cd /var/www/my-site

            cat > .env << EOF
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            JWT_SECRET=$JWT_SECRET
            SESSION_SECRET=$SESSION_SECRET
            OAUTH_GITHUB_KEY=$OAUTH_GITHUB_KEY
            OAUTH_GITHUB_SECRET=$OAUTH_GITHUB_SECRET
            GITHUB_CALLBACK_URL=https://moongate.top/auth/github/callback
            NUXT_PUBLIC_SITE_URL=https://moongate.top
            NUXT_PUBLIC_API_URL=https://moongate.top
            ACR_REGISTRY=$ACR_DOMAIN/$ACR_NAMESPACE
            EOF

            echo "$ACR_PASSWORD" | docker login "$ACR_DOMAIN" -u "$ACR_USERNAME" --password-stdin

            docker compose pull go-backend
            docker compose up -d --force-recreate go-backend

            docker image prune -f --filter "until=24h"

            docker compose ps
