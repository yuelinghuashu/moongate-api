name: Deploy Go Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Go image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/moongate/moongate-api:latest
            ${{ secrets.ACR_REGISTRY }}/moongate/moongate-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OAUTH_GITHUB_KEY: ${{ secrets.OAUTH_GITHUB_KEY }}
          OAUTH_GITHUB_SECRET: ${{ secrets.OAUTH_GITHUB_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: |
            ACR_REGISTRY,
            ACR_USERNAME,
            ACR_PASSWORD,
            POSTGRES_DB,
            POSTGRES_USER,
            POSTGRES_PASSWORD,
            JWT_SECRET,
            SESSION_SECRET,
            OAUTH_GITHUB_KEY,
            OAUTH_GITHUB_SECRET
          script: |
            set -e
            cd /var/www/my-site

            cat > .env << EOF
            # 数据库
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD

            # Go 后端
            JWT_SECRET=$JWT_SECRET
            SESSION_SECRET=$SESSION_SECRET
            OAUTH_GITHUB_KEY=$OAUTH_GITHUB_KEY
            OAUTH_GITHUB_SECRET=$OAUTH_GITHUB_SECRET
            GITHUB_CALLBACK_URL=https://moongate.top/auth/github/callback

            # Nuxt 前端
            NUXT_PUBLIC_SITE_URL=https://moongate.top

            # 镜像仓库（写完整地址）
            ACR_REGISTRY=$ACR_REGISTRY/moongate
            EOF

            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin

            docker compose pull go-backend
            docker compose up -d --force-recreate go-backend

            docker image prune -f --filter "until=24h"

            docker compose ps